name: CI / CD

on:
  push:
    branches: [main, dev]
    tags: ['*']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Configure SSH
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          rsync -rltpDz --delete --delay-updates
          --exclude='.well-known/' --chown=www:www
          dist/ root@host.service.caoxin.xyz:/www/wwwroot/www.caoxin.xyz/
